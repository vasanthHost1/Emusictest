<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxxy Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Global Buttons */
    button {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    /* Page */
    body {
      background: #121212;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* Search bar */
    .search-bar {
      display: flex;
      width: 90%;
      max-width: 400px;
      margin: 20px auto;
      border-radius: 25px;
      overflow: hidden;
      background: #282828;
    }
    .search-bar input {
      flex: 1;
      border: none;
      padding: 12px 15px;
      outline: none;
      background: transparent;
      color: white;
      font-size: 14px;
    }
    .search-bar button {
      background: #1db954;
      color: white;
      border: none;
      padding: 0 15px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Album art */
    .album-art {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 10px;
      margin-top: 20px;
      background: #333 center/cover no-repeat;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-direction: column;
    }
    .default-icon {
      fill: #1DB954;
      width: 90px;
      height: 90px;
      opacity: 0.6;
      margin-bottom: 10px;
    }
    .default-text {
      color: #1DB954;
      font-size: 1.8rem;
      font-weight: 600;
      opacity: 0.6;
      font-family: 'Poppins', sans-serif;
    }

    /* Song title / artist */
    .song-title {
      font-size: 1.2em;
      font-weight: 600;
      margin-top: 20px;
      text-align: center;
      padding: 0 15px;
    }
    .song-artist {
      font-size: 0.9em;
      opacity: 0.8;
      text-align: center;
      margin-top: 5px;
    }

    /* Controls */
    .controls {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }
    .controls button {
      background: #1db954;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .controls button:hover {
      transform: scale(1.1);
    }
    .controls svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    /* Progress bar */
    .progress-container {
      margin-top: 25px;
      width: 80%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .time {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8em;
      opacity: 0.8;
      margin-bottom: 5px;
    }
    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 5px;
      background: rgba(255,255,255,0.3);
      outline: none;
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
      box-shadow: -400px 0 0 400px #1db954;
    }

    /* Volume control */
    .volume-container {
      display: flex;
      align-items: center;
      position: relative;
    }
    #volumeControl {
      width: 0;
      opacity: 0;
      transition: width 0.3s ease, opacity 0.3s ease;
      margin-left: 5px;
      cursor: pointer;
    }
    .volume-container.show #volumeControl {
      width: 100px;
      opacity: 1;
    }
    #volumeBtn {
      background: #1db954;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #volumeBtn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* Playlist Panel */
    #playlistPanel {
      display: none;               
      position: fixed;
      right: 20px;
      bottom: 20px;                
      width: 280px;                
      background: #181818;
      padding: 12px;
      border-radius: 12px;
      max-height: 55vh;            
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
      animation: panelIn .25s ease-out;  
    }

    @keyframes panelIn {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* Input + button inside playlist */
    #playlistPanel input {
      width: calc(100% - 20px);
      padding: 8px 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: none;
      background: #282828;
      color: white;
      font-size: 14px;
    }
    #playlistPanel button {
      background: #1db954;
      border: none;
      color: white;
      padding: 6px 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    /* List */
    #playlistPanel ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #playlistPanel li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.05s ease;
    }
    #playlistPanel li:hover {
      background: rgba(29,185,84,0.15);
    }
    #playlistPanel li:active {
      transform: scale(0.995);
    }
    #playlistPanel li img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
    }
    #playlistPanel li span {
      flex: 1;
      font-size: 14px;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Delete button */
    .delete-btn {
      margin-left: auto;
      background: #e63946 !important;
      color: white;
      border: none;
      padding: 2px 6px !important;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px !important;
      margin-bottom: 0 !important;
    }
    .delete-btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search a song...">
    <button onclick="searchSong()">Search</button>
    <button onclick="togglePlaylistPanel()">Playlist</button>
  </div>

  <!-- Album Art -->
  <div class="album-art" id="thumbnail">
    <svg class="default-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
    </svg>
    <div class="default-text">Foxxy</div>
  </div>

  <!-- Song Info -->
  <div class="song-title" id="videoTitle">Song Title</div>
  <div class="song-artist" id="videoArtist">Artist</div>

  <!-- Controls -->
  <div class="controls">
    <button id="playPauseBtn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div class="volume-container">
      <button id="volumeBtn" onclick="toggleVolumeSlider()">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
      </button>
      <input type="range" id="volumeControl" min="0" max="100" value="100">
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-container">
    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
    <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
  </div>

  <!-- Playlist Panel -->
  <div id="playlistPanel">
    <input type="text" id="playlistInput" placeholder="Add song to playlist...">
    <button onclick="addPlaylistInputSong()">Add</button>
    <ul id="playlist"></ul>
  </div>

  <!-- Hidden Player -->
  <div id="player" style="position:absolute; left:-9999px;"></div>

<script>
let player, isPlaying = false, interval;
const apiKeys = ["AIzaSyA6HuHCZSivAGvISxA4h3EglIQJgmee66k","AIzaSyCkUWUbVYjZDNRhNJBJ-NkN8ta3ga4vY3Y","AIzaSyD8TitWTpspygPuDnbilqeaLj9AG1krL48"];
let currentKeyIndex = 0;

let playlistSongs = JSON.parse(localStorage.getItem('playlistSongs') || '[]');
let currentSongIndex = -1; 
let currentVideoId = '';
let isDraggingProgress = false; 

// SPOTIFY VIBE ENGINE STATE
let playedHistory = new Set();       // Stores Video IDs
let playedTitleSignatures = new Set(); // Stores Normalized Song Signatures (Prevents same song from diff channel)
let vibeQueue = [];                  // Smooth Vibe Station Queue
let currentSeedArtist = "";
let isFetchingQueue = false;

function getApiKey() {
    const key = apiKeys[currentKeyIndex];
    currentKeyIndex = (currentKeyIndex + 1) % apiKeys.length;
    return key;
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

// ----------------- Spotify-Style Smart Filters ----------------- //

// Generates a unique signature of the song (e.g., "Taylor Swift Blank Space" -> "blankspacetaylorswift")
function getTitleSignature(title) {
    return title.toLowerCase()
        .replace(/\(.*?\)/g, '')
        .replace(/\[.*?\]/g, '')
        .replace(/ft\..*|feat\..*/gi, '')
        .replace(/official video|official audio|lyric video|lyrics|video|audio|hd|4k|mv/gi, '')
        .replace(/[^a-z0-9\s]/g, '')
        .trim()
        .split(/\s+/)
        .filter(w => w.length > 2)
        .sort()
        .join('');
}

// Filters out YouTube Shorts, TikTok clips, 1-hour loops, covers, reactions, and duplicates
function isValidMusicTrack(video) {
    if (!video || !video.id || !video.id.videoId) return false;
    
    const videoId = video.id.videoId;
    const title = video.snippet.title.toLowerCase();
    
    // Check ID duplicate
    if (playedHistory.has(videoId)) return false;

    // Strict Junk & Shorts Filter
    const BANNED_TERMS = [
        '#short', '#shorts', 'shorts', 'short', 'tiktok', 'reel', 'reels',
        '1 hour', '10 hour', 'loop', 'status', 'whatsapp status', 'reaction',
        'cover', 'tutorial', 'how to', 'behind the scenes', 'trailer', 'teaser',
        'slowed', 'reverb', 'speed up', 'nightcore', 'full album', 'extended mix', 'instrumental'
    ];

    for (let term of BANNED_TERMS) {
        if (title.includes(term)) return false;
    }

    // Check Title Signature Duplicate (Prevents same song uploaded by different channels)
    const signature = getTitleSignature(video.snippet.title);
    if (signature && playedTitleSignatures.has(signature)) return false;

    return true;
}

// Extract clean artist name from video title or channel
function extractArtist(channelTitle, title) {
    let cleanChannel = channelTitle.replace(/ - Topic|VEVO|Official|Music/ig, '').trim();
    if (title.includes('-')) {
        const parts = title.split('-');
        if (parts[0].trim().length > 2) {
            return parts[0].trim();
        }
    }
    return cleanChannel;
}

// ----------------- Player Initialization ----------------- //
function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '10', width: '10',
        videoId: '',
        playerVars: { autoplay: 1, controls: 0, modestbranding: 1, rel: 0 },
        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange
        }
    });
}

function onPlayerReady() {
    interval = setInterval(updateProgress, 1000);
    player.setVolume(document.getElementById('volumeControl').value);
}

function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playIcon').style.display = "none";
        document.getElementById('pauseIcon').style.display = "block";
    } else if (e.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        document.getElementById('playIcon').style.display = "block";
        document.getElementById('pauseIcon').style.display = "none";
    } else if (e.data === YT.PlayerState.ENDED) {
        playNextSong();
    }
}

// ----------------- Playback & Vibe Queue Control ----------------- //
function playVideoData(id, title, thumb, channelTitle = "YouTube Audio") {
    currentVideoId = id;
    
    // Register song to prevent future duplicates
    playedHistory.add(id);
    const signature = getTitleSignature(title);
    if (signature) playedTitleSignatures.add(signature);
    
    if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(id);
    }
    
    const artist = extractArtist(channelTitle, title);
    document.getElementById('videoTitle').innerText = title;
    document.getElementById('videoArtist').innerText = artist;
    document.getElementById('thumbnail').style.backgroundImage = `url(${thumb})`;
    
    document.querySelector('.default-icon').style.display = 'none';
    document.querySelector('.default-text').style.display = 'none';
    
    isPlaying = true;
    document.getElementById('playIcon').style.display = "none";
    document.getElementById('pauseIcon').style.display = "block";

    // Initialize or refresh the Spotify Vibe Radio Queue
    if (currentSeedArtist !== artist) {
        currentSeedArtist = artist;
        vibeQueue = []; // Clear queue for new vibe
        fetchVibeTracks();
    } else if (vibeQueue.length < 3) {
        fetchVibeTracks(); // Refill queue in background
    }
}

function togglePlay() {
    if (!currentVideoId) return;
    if (!isPlaying) {
        player.playVideo();
    } else {
        player.pauseVideo();
    }
}

// ----------------- Spotify Vibe Radio Engine ----------------- //
function fetchVibeTracks() {
    if (isFetchingQueue || !currentSeedArtist) return;
    isFetchingQueue = true;
    
    const apiKey = getApiKey();
    // Searches YouTube Music Topic Mixes & Radios for exact genre/vibe matching
    const query = `"${currentSeedArtist}" radio mix official audio`;
    
    fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&videoCategoryId=10&maxResults=25&key=${apiKey}`)
    .then(res => res.json())
    .then(data => {
        isFetchingQueue = false;
        if (!data.items) return;
        
        // Filter out Shorts, junk, and duplicates
        const validTracks = data.items.filter(item => isValidMusicTrack(item));
        
        // Slightly shuffle valid tracks to make flow organic
        validTracks.sort(() => Math.random() - 0.5);
        
        vibeQueue.push(...validTracks);
    })
    .catch(() => {
        isFetchingQueue = false;
    });
}

function playNextSong() {
    // 1. If user is currently playing a local playlist, play next item in playlist
    if (currentSongIndex >= 0 && currentSongIndex < playlistSongs.length - 1) {
        currentSongIndex++;
        playSongAt(currentSongIndex);
        return;
    }
    
    // 2. Otherwise, play from the Spotify Vibe Queue
    if (vibeQueue.length > 0) {
        const nextVideo = vibeQueue.shift();
        currentSongIndex = -1; // Detach from static playlist
        playVideoData(
            nextVideo.id.videoId,
            nextVideo.snippet.title,
            nextVideo.snippet.thumbnails.medium.url,
            nextVideo.snippet.channelTitle
        );
    } else {
        // Fallback if queue empty: Refill immediately
        fetchVibeTracks();
        setTimeout(() => {
            if (vibeQueue.length > 0) playNextSong();
        }, 1200);
    }
}

// ----------------- Searching & Playlist ----------------- //
function searchSong(query, save = false) {
    query = query || document.getElementById('searchInput').value.trim();
    if (!query) return;
    
    const apiKey = getApiKey();
    fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&key=${apiKey}&type=video&videoCategoryId=10&maxResults=5`)
    .then(res => res.json())
    .then(data => {
        if (!data.items || !data.items.length) return;
        
        // Find first valid non-short track
        const video = data.items.find(item => isValidMusicTrack(item)) || data.items[0];
        
        if (!save) {
            currentSongIndex = -1; 
            playVideoData(
                video.id.videoId,
                video.snippet.title,
                video.snippet.thumbnails.medium.url,
                video.snippet.channelTitle
            );
        } else {
            playlistSongs.push({
                name: video.snippet.title,
                thumb: video.snippet.thumbnails.default.url,
                id: video.id.videoId,
                channel: video.snippet.channelTitle
            });
            savePlaylist();
            updatePlaylistUI();
        }
    });
}

function togglePlaylistPanel() {
    const panel = document.getElementById('playlistPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function addPlaylistInputSong() {
    const songName = document.getElementById('playlistInput').value.trim();
    if (!songName) return;
    searchSong(songName, true);
    document.getElementById('playlistInput').value = '';
}

function savePlaylist() {
    localStorage.setItem('playlistSongs', JSON.stringify(playlistSongs));
}

function updatePlaylistUI() {
    const ul = document.getElementById('playlist');
    ul.innerHTML = '';
    playlistSongs.forEach((song, idx) => {
        const li = document.createElement('li');
        
        const img = document.createElement('img');
        img.src = song.thumb;
        li.appendChild(img);
        
        const span = document.createElement('span');
        span.textContent = song.name;
        li.appendChild(span);
        
        li.onclick = function(e) {
            if (e.target.classList.contains('delete-btn')) return;
            currentSongIndex = idx;
            playVideoData(song.id, song.name, song.thumb, song.channel || "YouTube Audio");
        };
        
        const del = document.createElement('button');
        del.textContent = "X";
        del.className = "delete-btn";
        del.onclick = function(e) {
            e.stopPropagation();
            deleteSong(idx);
        };
        
        li.appendChild(del);
        ul.appendChild(li);
    });
}

function deleteSong(idx) {
    playlistSongs.splice(idx, 1);
    savePlaylist();
    updatePlaylistUI();
}

function playSongAt(idx) {
    const song = playlistSongs[idx];
    if (!song) return;
    playVideoData(song.id, song.name, song.thumb, song.channel || "YouTube Audio");
}

// ----------------- UI / Event Listeners ----------------- //
function toggleVolumeSlider() {
    document.querySelector('.volume-container').classList.toggle('show');
}

document.getElementById('volumeControl').addEventListener('input', function() {
    if(player && typeof player.setVolume === 'function') {
        player.setVolume(this.value);
    }
});

const progressBar = document.getElementById('progressBar');
progressBar.addEventListener('mousedown', () => isDraggingProgress = true);
progressBar.addEventListener('touchstart', () => isDraggingProgress = true);
progressBar.addEventListener('mouseup', () => isDraggingProgress = false);
progressBar.addEventListener('touchend', () => isDraggingProgress = false);

progressBar.addEventListener('change', function() {
   if (player && typeof player.getDuration === 'function') {
        const dur = player.getDuration();
        const seekTo = (this.value / 100) * dur;
        player.seekTo(seekTo, true);
    }
});

function updateProgress() {
    if (player && typeof player.getCurrentTime === 'function') {
        const current = player.getCurrentTime();
        const dur = player.getDuration();
        
        document.getElementById('currentTime').innerText = formatTime(current);
        if (dur > 0) {
            document.getElementById('totalTime').innerText = formatTime(dur);
            if (!isDraggingProgress) { 
                document.getElementById('progressBar').value = (current / dur) * 100 || 0;
            }
        }
    }
}

document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchSong();
});
document.getElementById('playlistInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') addPlaylistInputSong();
});

// Init
updatePlaylistUI();
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);
</script>

</body>
</html>

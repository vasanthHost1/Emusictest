<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxxy Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Buttons (global) */
    button {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    /* Page */
    body {
      background: #121212;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* Search bar */
    .search-bar {
      display: flex;
      width: 90%;
      max-width: 400px;
      margin: 20px auto;
      border-radius: 25px;
      overflow: hidden;
      background: #282828;
    }
    .search-bar input {
      flex: 1;
      border: none;
      padding: 12px 15px;
      outline: none;
      background: transparent;
      color: white;
      font-size: 14px;
    }
    .search-bar button {
      background: #1db954;
      color: white;
      border: none;
      padding: 0 15px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Album art */
    .album-art {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 10px;
      margin-top: 20px;
      background: #333 center/cover no-repeat;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-direction: column;
    }
    .default-icon {
      fill: #1DB954;
      width: 90px;
      height: 90px;
      opacity: 0.6;
      margin-bottom: 10px;
    }
    .default-text {
      color: #1DB954;
      font-size: 1.8rem;
      font-weight: 600;
      opacity: 0.6;
      font-family: 'Poppins', sans-serif;
    }

    /* Song title / artist */
    .song-title {
      font-size: 1.2em;
      font-weight: 600;
      margin-top: 20px;
      text-align: center;
      padding: 0 15px;
    }
    .song-artist {
      font-size: 0.9em;
      opacity: 0.8;
      text-align: center;
      margin-top: 5px;
    }

    /* Controls */
    .controls {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }
    .controls button {
      background: #1db954;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .controls button:hover {
      transform: scale(1.1);
    }
    .controls svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    /* Progress bar */
    .progress-container {
      margin-top: 25px;
      width: 80%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .time {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8em;
      opacity: 0.8;
      margin-bottom: 5px;
    }
    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 5px;
      background: rgba(255,255,255,0.3);
      outline: none;
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
      box-shadow: -400px 0 0 400px #1db954;
    }

    /* Volume control */
    .volume-container {
      display: flex;
      align-items: center;
      position: relative;
    }
    #volumeControl {
      width: 0;
      opacity: 0;
      transition: width 0.3s ease, opacity 0.3s ease;
      margin-left: 5px;
      cursor: pointer;
    }
    .volume-container.show #volumeControl {
      width: 100px;
      opacity: 1;
    }
    #volumeBtn {
      background: #1db954;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #volumeBtn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* Playlist Panel */
    #playlistPanel {
      display: none;               
      position: fixed;
      right: 20px;
      bottom: 20px;                
      width: 280px;                
      background: #181818;
      padding: 12px;
      border-radius: 12px;
      max-height: 55vh;            
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
      animation: panelIn .25s ease-out;  
    }

    @keyframes panelIn {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* Input + button inside playlist */
    #playlistPanel input {
      width: calc(100% - 20px);
      padding: 8px 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: none;
      background: #282828;
      color: white;
      font-size: 14px;
    }
    #playlistPanel button {
      background: #1db954;
      border: none;
      color: white;
      padding: 6px 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    /* List */
    #playlistPanel ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #playlistPanel li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.05s ease;
    }
    #playlistPanel li:hover {
      background: rgba(29,185,84,0.15);
    }
    #playlistPanel li:active {
      transform: scale(0.995);
    }
    #playlistPanel li img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
    }
    #playlistPanel li span {
      flex: 1;
      font-size: 14px;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Delete button */
    .delete-btn {
      margin-left: auto;
      background: #e63946 !important;
      color: white;
      border: none;
      padding: 2px 6px !important;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px !important;
      margin-bottom: 0 !important;
    }
    .delete-btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search a song...">
    <button onclick="searchSong()">Search</button>
    <button onclick="togglePlaylistPanel()">Playlist</button>
  </div>

  <!-- Album Art -->
  <div class="album-art" id="thumbnail">
    <svg class="default-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
    </svg>
    <div class="default-text">Foxxy</div>
  </div>

  <!-- Song Info -->
  <div class="song-title" id="videoTitle">Song Title</div>
  <div class="song-artist" id="videoArtist">Artist</div>

  <!-- Controls -->
  <div class="controls">
    <button id="playPauseBtn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div class="volume-container">
      <button id="volumeBtn" onclick="toggleVolumeSlider()">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
      </button>
      <input type="range" id="volumeControl" min="0" max="100" value="100">
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-container">
    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
    <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
  </div>

  <!-- Playlist Panel -->
  <div id="playlistPanel">
    <input type="text" id="playlistInput" placeholder="Add song to playlist...">
    <button onclick="addPlaylistInputSong()">Add</button>
    <ul id="playlist"></ul>
  </div>

  <!-- Hidden Player -->
  <div id="player" style="position:absolute; left:-9999px;"></div>

<script>
let player, isPlaying = false, interval;
const apiKeys = ["AIzaSyA6HuHCZSivAGvISxA4h3EglIQJgmee66k","AIzaSyCkUWUbVYjZDNRhNJBJ-NkN8ta3ga4vY3Y","AIzaSyD8TitWTpspygPuDnbilqeaLj9AG1krL48"];
let currentKeyIndex = 0;

let playlistSongs = JSON.parse(localStorage.getItem('playlistSongs') || '[]');
let currentSongIndex = -1; 
let currentVideoId = '';
let isDraggingProgress = false; 

// NEW: Keep track of played songs to prevent loops
let playedHistory = new Set(); 

function getApiKey() {
    const key = apiKeys[currentKeyIndex];
    currentKeyIndex = (currentKeyIndex + 1) % apiKeys.length;
    return key;
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

// ----------------- Player Initialization ----------------- //
function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '10', width: '10',
        videoId: '',
        playerVars: { autoplay: 1, controls: 0, modestbranding: 1, rel: 0 },
        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange
        }
    });
}

function onPlayerReady() {
    interval = setInterval(updateProgress, 1000);
    player.setVolume(document.getElementById('volumeControl').value);
}

function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playIcon').style.display = "none";
        document.getElementById('pauseIcon').style.display = "block";
    } else if (e.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        document.getElementById('playIcon').style.display = "block";
        document.getElementById('pauseIcon').style.display = "none";
    } else if (e.data === YT.PlayerState.ENDED) {
        playNextSong();
    }
}

// ----------------- Core Playback Functions ----------------- //
function playVideoData(id, title, thumb) {
    currentVideoId = id;
    playedHistory.add(id); // ADD TO HISTORY so we don't play it again
    
    if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(id);
    }
    
    document.getElementById('videoTitle').innerText = title;
    document.getElementById('videoArtist').innerText = "YouTube Audio";
    document.getElementById('thumbnail').style.backgroundImage = `url(${thumb})`;
    
    document.querySelector('.default-icon').style.display = 'none';
    document.querySelector('.default-text').style.display = 'none';
    
    isPlaying = true;
    document.getElementById('playIcon').style.display = "none";
    document.getElementById('pauseIcon').style.display = "block";
}

function togglePlay() {
    if (!currentVideoId) return;
    if (!isPlaying) {
        player.playVideo();
    } else {
        player.pauseVideo();
    }
}

// ----------------- The "Smart Autoplay" Engine ----------------- //
function playNextSong() {
    if (currentSongIndex >= 0 && currentSongIndex < playlistSongs.length - 1) {
        currentSongIndex++;
        playSongAt(currentSongIndex);
    } else {
        fetchAndPlaySimilarSong(currentVideoId);
    }
}

function fetchAndPlaySimilarSong(videoId) {
    if (!videoId) return;
    const apiKey = getApiKey();
    
    // 1. Fetch current video details to get tags/genres
    fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${apiKey}`)
    .then(res => res.json())
    .then(data => {
        if (!data.items || !data.items.length) return playRandomFallback();
        
        const snippet = data.items[0].snippet;
        let artistName = snippet.channelTitle.replace(/ - Topic|VEVO/ig, '').trim();
        
        // Default search if we can't find good tags
        let searchQuery = `${artistName} mix`; 

        // 2. Read the video's hidden tags to discover related genres and artists
        if (snippet.tags && snippet.tags.length > 0) {
            // Filter out boring generic words
            const ignored = ['music', 'official', 'video', 'lyrics', 'audio', 'pop'];
            const goodTags = snippet.tags.filter(t => t.length > 2 && !ignored.includes(t.toLowerCase()));
            
            if (goodTags.length > 0) {
                // Pick a random tag from the song
                const randomTag = goodTags[Math.floor(Math.random() * goodTags.length)];
                const r = Math.random();
                
                // Randomly branch out to mimic YouTube's algorithm
                if (r < 0.4) {
                    // 40% chance: Pivot to the genre or mood of the song (brings in new artists)
                    searchQuery = `${randomTag} song`;
                } else if (r < 0.7) {
                    // 30% chance: Mix the current artist with the genre/tag
                    searchQuery = `${artistName} ${randomTag}`;
                } else {
                    // 30% chance: Look for similar artists
                    searchQuery = `${artistName} similar artists`;
                }
            }
        }

        // 3. Search for the next song using our generated smart query
        fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(searchQuery)}&type=video&videoCategoryId=10&maxResults=15&key=${apiKey}`)
        .then(res => res.json())
        .then(searchData => {
            if (!searchData.items || !searchData.items.length) return playRandomFallback();
            
            // 4. FILTER OUT SONGS WE HAVE ALREADY PLAYED
            const unplayedVideos = searchData.items.filter(item => !playedHistory.has(item.id.videoId));
            const results = unplayedVideos.length > 0 ? unplayedVideos : searchData.items;
            
            // Pick randomly from top 5 relevant unplayed results
            const nextVideo = results[Math.floor(Math.random() * Math.min(5, results.length))];
            
            currentSongIndex = -1; 
            playVideoData(nextVideo.id.videoId, nextVideo.snippet.title, nextVideo.snippet.thumbnails.medium.url);
        })
        .catch(() => playRandomFallback());
    })
    .catch(() => playRandomFallback());
}

function playRandomFallback() {
    const apiKey = getApiKey();
    const terms = ["trending pop hits", "lofi beats", "top 50 songs", "acoustic covers"];
    const term = terms[Math.floor(Math.random() * terms.length)];
    
    fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(term)}&type=video&videoCategoryId=10&maxResults=15&key=${apiKey}`)
    .then(res => res.json())
    .then(data => {
        if (data.items && data.items.length > 0) {
            const unplayedVideos = data.items.filter(item => !playedHistory.has(item.id.videoId));
            const results = unplayedVideos.length > 0 ? unplayedVideos : data.items;
            const nextVideo = results[Math.floor(Math.random() * Math.min(5, results.length))];
            currentSongIndex = -1;
            playVideoData(nextVideo.id.videoId, nextVideo.snippet.title, nextVideo.snippet.thumbnails.medium.url);
        }
    });
}

// ----------------- Searching & Playlist ----------------- //
function searchSong(query, save = false) {
    query = query || document.getElementById('searchInput').value.trim();
    if (!query) return;
    
    const apiKey = getApiKey();
    fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&key=${apiKey}&type=video&videoCategoryId=10&maxResults=1`)
    .then(res => res.json())
    .then(data => {
        if (!data.items || !data.items.length) return;
        const video = data.items[0];
        
        if (!save) {
            currentSongIndex = -1; 
            playVideoData(video.id.videoId, video.snippet.title, video.snippet.thumbnails.medium.url);
        } else {
            playlistSongs.push({
                name: video.snippet.title,
                thumb: video.snippet.thumbnails.default.url,
                id: video.id.videoId
            });
            savePlaylist();
            updatePlaylistUI();
        }
    });
}

function togglePlaylistPanel() {
    const panel = document.getElementById('playlistPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function addPlaylistInputSong() {
    const songName = document.getElementById('playlistInput').value.trim();
    if (!songName) return;
    searchSong(songName, true);
    document.getElementById('playlistInput').value = '';
}

function savePlaylist() {
    localStorage.setItem('playlistSongs', JSON.stringify(playlistSongs));
}

function updatePlaylistUI() {
    const ul = document.getElementById('playlist');
    ul.innerHTML = '';
    playlistSongs.forEach((song, idx) => {
        const li = document.createElement('li');
        
        const img = document.createElement('img');
        img.src = song.thumb;
        li.appendChild(img);
        
        const span = document.createElement('span');
        span.textContent = song.name;
        li.appendChild(span);
        
        li.onclick = function(e) {
            if (e.target.classList.contains('delete-btn')) return;
            currentSongIndex = idx;
            playVideoData(song.id, song.name, song.thumb);
        };
        
        const del = document.createElement('button');
        del.textContent = "X";
        del.className = "delete-btn";
        del.onclick = function(e) {
            e.stopPropagation();
            deleteSong(idx);
        };
        
        li.appendChild(del);
        ul.appendChild(li);
    });
}

function deleteSong(idx) {
    playlistSongs.splice(idx, 1);
    savePlaylist();
    updatePlaylistUI();
}

function playSongAt(idx) {
    const song = playlistSongs[idx];
    if (!song) return;
    playVideoData(song.id, song.name, song.thumb);
}

// ----------------- UI / Event Listeners ----------------- //
function toggleVolumeSlider() {
    document.querySelector('.volume-container').classList.toggle('show');
}

document.getElementById('volumeControl').addEventListener('input', function() {
    if(player && typeof player.setVolume === 'function') {
        player.setVolume(this.value);
    }
});

const progressBar = document.getElementById('progressBar');
progressBar.addEventListener('mousedown', () => isDraggingProgress = true);
progressBar.addEventListener('touchstart', () => isDraggingProgress = true);
progressBar.addEventListener('mouseup', () => isDraggingProgress = false);
progressBar.addEventListener('touchend', () => isDraggingProgress = false);

progressBar.addEventListener('change', function() {
    if (player && typeof player.getDuration === 'function') {
        const dur = player.getDuration();
        const seekTo = (this.value / 100) * dur;
        player.seekTo(seekTo, true);
    }
});

function updateProgress() {
    if (player && typeof player.getCurrentTime === 'function') {
        const current = player.getCurrentTime();
        const dur = player.getDuration();
        
        document.getElementById('currentTime').innerText = formatTime(current);
        if (dur > 0) {
            document.getElementById('totalTime').innerText = formatTime(dur);
            if (!isDraggingProgress) { 
                document.getElementById('progressBar').value = (current / dur) * 100 || 0;
            }
        }
    }
}

document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') addPlaylistInputSong();
});

// Init
updatePlaylistUI();
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);
</script>

</body>
</html>
